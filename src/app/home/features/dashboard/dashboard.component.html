<div class="mx-4 flex flex-col gap-10 py-2">
  <div
    class="flex items-center justify-between rounded-4xl border-2 border-blue-100/30 bg-blue-50/20 p-4 shadow-2xl shadow-blue-50 backdrop-blur-3xl"
  >
    <div class="">
      <h1 class="text-2xl font-bold whitespace-pre text-blue-400">Dashboard</h1>
    </div>
    <div>
      <button
        class="rounded-full bg-blue-300 px-4 py-2 font-bold text-white"
        (click)="openCreateTask()"
      >
        Criar Tarefa
      </button>
    </div>
  </div>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    @for (task of tasks(); track task) {
      <div
        class="mb-3 flex flex-col gap-1.5 rounded-4xl border-2 border-blue-100/30 bg-blue-50/20 p-4 shadow-lg shadow-blue-50"
      >
        <div class="flex items-center justify-between gap-1">
          <div class="flex items-center justify-start gap-1">
            <p class="font-medium text-blue-400">Titulo:</p>
            <p class="text-blue-300">{{ task.title }}</p>
          </div>
          <div>
            <button
              (click)="openRename({ labelId: task.id })"
              class="rounded-full bg-blue-300 w-10 h-10 pt-1 font-medium text-white"
            >
              <mat-icon aria-hidden="false" aria-label='rename'>edit</mat-icon>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between gap-1">
          <div class="flex items-center justify-start gap-1">
            <p class="font-medium text-blue-400">Descrição:</p>
            <p class="text-blue-300">
              {{ task.description ? task.description : 'Nenhuma descrição disponível' }}
            </p>
          </div>
        </div>
        <div class="flex items-center justify-start gap-1">
          <p class="font-medium text-blue-400">Categoria:</p>
          <p class="text-blue-300">{{ task.category.title }}</p>
        </div>
        <div class="flex items-center justify-start gap-1">
          <p class="font-medium text-blue-400">Status:</p>
          @if (task.status === 'incompleta') {
            <button
              (click)="updateTaskStatus({ status: 'concluida', taskId: task.id })"
              class="rounded-full bg-blue-300 px-3 py-1 font-medium text-white"
            >
              marcar como concluída
            </button>
          }
          @if (task.status === 'concluida') {
            <button
              (click)="updateTaskStatus({ status: 'incompleta', taskId: task.id })"
              class="rounded-full bg-green-300 px-3 py-1 font-medium text-white"
            >
              marcar como incompleta
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
